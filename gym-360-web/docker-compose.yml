# Dokploy deploys this as separate app. Build context = gym-360-web/.
# Traefik labels assume Dokploy's default cert resolver name "letsencrypt"
# and external network "dokploy-network" (verify in Dokploy → Settings).
#
# Required env (set in Dokploy app → Environment):
#   NEXT_PUBLIC_API_URL=https://staging-api.gym-360.com/api/v1
#   NEXTAUTH_SECRET=<generate strong>
#   NEXTAUTH_URL_ADMIN=https://staging-admin.gym-360.com
#   NEXTAUTH_URL_STAFF=https://staging-staff.gym-360.com

services:
  gym-360-admin-web:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: gym-360-admin-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL_ADMIN}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.gym-360-admin-web.rule=Host(`staging-admin.gym-360.com`)"
      - "traefik.http.routers.gym-360-admin-web.entrypoints=websecure"
      - "traefik.http.routers.gym-360-admin-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.gym-360-admin-web.loadbalancer.server.port=3000"

  gym-360-staff-web:
    build:
      context: .
      dockerfile: Dockerfile.gym-staff
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: gym-360-staff-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL_STAFF}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.gym-360-staff-web.rule=Host(`staging-staff.gym-360.com`)"
      - "traefik.http.routers.gym-360-staff-web.entrypoints=websecure"
      - "traefik.http.routers.gym-360-staff-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.gym-360-staff-web.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
