# All secret values default to DEV-ONLY fallbacks via ${VAR:-default} so
# `docker-compose up` works out of the box. In production, supply these via
# a .env file or the host environment — never commit real secrets.

services:
  gymapp-api:
    build:
      context: .
      dockerfile: src/API/GymApp.Api/Dockerfile
    container_name: gymapp-api
    ports:
      # Bind to loopback only — Dokploy/Traefik reaches the API via the internal
      # docker network. Local dev still works through 127.0.0.1:8080.
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Database=Server=gymapp-db,1433;Database=GymApp;User Id=sa;Password=${DB_SA_PASSWORD:-GymApp_P@ss2024!};TrustServerCertificate=True
      - ConnectionStrings__Redis=gymapp-redis:6379,password=${REDIS_PASSWORD:-devredis}
      - ConnectionStrings__RabbitMq=amqp://${RABBITMQ_DEFAULT_USER:-gymapp}:${RABBITMQ_DEFAULT_PASS:-devrabbit}@gymapp-rabbitmq:5672
      - Jwt__SecretKey=${JWT_SECRET_KEY:-dev-only-jwt-secret-not-for-production-minimum-32-chars!}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_0:-http://localhost:3000}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_1:-http://localhost:3001}
      - Cors__AllowedOrigins__2=${CORS_ORIGIN_2:-http://localhost:3003}
      # Staging web hosts — always allowed so deployed admin/staff logins pass CORS.
      - Cors__AllowedOrigins__3=${CORS_ORIGIN_3:-https://staging-admin.gym-365.com}
      - Cors__AllowedOrigins__4=${CORS_ORIGIN_4:-https://staging-staff.gym-365.com}
      # FCM disabled by default. To enable: set FCM_ENABLED=true, place the
      # service-account JSON at ./config/firebase-service-account.json, and
      # uncomment the matching volume mount below.
      - Fcm__IsEnabled=${FCM_ENABLED:-false}
      - Fcm__ProjectId=${FCM_PROJECT_ID:-forma-389d6}
      - Fcm__ServiceAccountKeyPath=/run/secrets/firebase-service-account.json
      - Tenancy__Mode=${TENANCY_MODE:-Hard}
      # Run EF migrations + Hard-mode fresh-DB self-bootstrap at startup.
      # Required on Dokploy (non-Development env) so deploys come up without a
      # manual SQL step. Safe/idempotent; never auto-stamps a DB with soft data.
      - Database__AutoMigrate=${DB_AUTO_MIGRATE:-true}
      # Production posture: NO demo gym, NO demo trainer/trainee/staff/owner
      # users. Override these to true in .env (or shell) only for local dev.
      - Tenancy__RunDevSeedersOnHard=${TENANCY_RUN_DEV_SEEDERS_ON_HARD:-false}
      - Seed__RunDemoData=${SEED_RUN_DEMO_DATA:-false}
      - Identity__RunDevSeeder=${IDENTITY_RUN_DEV_SEEDER:-true}
      - Identity__DevSeederScope=${IDENTITY_DEV_SEEDER_SCOPE:-admin}
      # OpenTelemetry → self-hosted SigNoz (deploy/signoz). No-op unless
      # OTEL_EXPORTER_OTLP_ENDPOINT is set, so it defaults to empty/off and only
      # activates on staging where SigNoz runs. Collector reached over the external
      # `signoz-net` network (joined below), which the SigNoz compose creates with a
      # fixed name — so no edit to SigNoz's git-sourced compose is needed. Deploy
      # SigNoz first so the network exists. OTLP/HTTP on :4318.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-gymapp-api}
    # FCM service-account mount disabled by default. The host file is gitignored
    # and missing on Dokploy hosts, which causes a bind-mount failure at start.
    # Re-enable locally once ./config/firebase-service-account.json exists.
    # volumes:
    #   - ./config/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      gymapp-db:
        condition: service_healthy
      gymapp-redis:
        condition: service_healthy
      gymapp-rabbitmq:
        condition: service_healthy
    networks:
      - gymapp-network
      # Shared external network (Dokploy/Traefik). API joins it to reach
      # signoz-otel-collector by name for OTLP — attach the SigNoz compose to
      # this same dokploy-network in Dokploy. Re-attached on every API redeploy.
      - dokploy-network

  gymapp-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gymapp-db
    platform: linux/amd64
    ports:
      # Loopback only — never expose SQL Server to the public interface.
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD:-GymApp_P@ss2024!}
      - MSSQL_PID=Developer
    volumes:
      - gymapp-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_SA_PASSWORD:-GymApp_P@ss2024!}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gymapp-network

  gymapp-redis:
    image: redis:7-alpine
    container_name: gymapp-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    ports:
      # Loopback only — never expose Redis to the public interface.
      - "127.0.0.1:6380:6379"
    volumes:
      - gymapp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gymapp-network

  gymapp-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gymapp-rabbitmq
    ports:
      # Loopback only — never expose RabbitMQ AMQP or management UI publicly.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-gymapp}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-devrabbit}
    volumes:
      - gymapp-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymapp-network

  # --- Web apps (Next.js, monorepo in gym-360-web/) ---
  # Routed by Traefik via the labels below on the external dokploy-network.
  # NEXT_PUBLIC_API_URL is a BUILD ARG (baked into the JS bundle) — changing it
  # requires a rebuild, not just a restart.
  gym-360-admin-web:
    build:
      context: ./gym-360-web
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${WEB_API_URL:-https://staging-api.gym-365.com/api/v1}
    container_name: gym-360-admin-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${WEB_API_URL:-https://staging-api.gym-365.com/api/v1}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL_ADMIN:-https://staging-admin.gym-365.com}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.gym-360-admin-web.rule=Host(`staging-admin.gym-365.com`)"
      - "traefik.http.routers.gym-360-admin-web.entrypoints=websecure"
      - "traefik.http.routers.gym-360-admin-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.gym-360-admin-web.loadbalancer.server.port=3000"

  gym-360-staff-web:
    build:
      context: ./gym-360-web
      dockerfile: Dockerfile.gym-staff
      args:
        NEXT_PUBLIC_API_URL: ${WEB_API_URL:-https://staging-api.gym-365.com/api/v1}
    container_name: gym-360-staff-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${WEB_API_URL:-https://staging-api.gym-365.com/api/v1}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL_STAFF:-https://staging-staff.gym-365.com}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.gym-360-staff-web.rule=Host(`staging-staff.gym-365.com`)"
      - "traefik.http.routers.gym-360-staff-web.entrypoints=websecure"
      - "traefik.http.routers.gym-360-staff-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.gym-360-staff-web.loadbalancer.server.port=3000"

volumes:
  gymapp-db-data:
  gymapp-redis-data:
  gymapp-rabbitmq-data:

networks:
  gymapp-network:
  # External network created by Dokploy; Traefik lives here and routes the web apps.
  dokploy-network:
    external: true
    driver: bridge
  # External network created by the SigNoz compose (deploy/signoz, fixed name
  # `signoz-net`). External here so this compose joins it instead of creating it —
  # deploy SigNoz before the API so the network already exists.
  signoz-net:
    external: true
