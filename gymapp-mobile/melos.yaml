name: gymapp_mobile

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart analyze .
    exec:
      concurrency: 5

  test:
    run: flutter test
    exec:
      concurrency: 5
    packageFilters:
      dirExists: test

  build_runner:
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1
    packageFilters:
      dependsOn: build_runner

  clean:
    run: flutter clean
    exec:
      concurrency: 5

  format:
    run: dart format .
    exec:
      concurrency: 5
