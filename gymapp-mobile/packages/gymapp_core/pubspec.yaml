name: gymapp_core
description: Shared core package for Gym 360 Flutter apps - models, network, theme, widgets, l10n
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dartz: ^0.10.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  flutter_secure_storage: ^9.0.0
  firebase_messaging: ^15.1.0
  firebase_core: ^3.6.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  logger: ^2.0.2+1
  url_launcher: ^6.2.2
  bcrypt: ^1.1.3
  signalr_netcore: ^1.4.1
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1

flutter:
  generate: true

  assets:
    - assets/images/
    - assets/icons/
