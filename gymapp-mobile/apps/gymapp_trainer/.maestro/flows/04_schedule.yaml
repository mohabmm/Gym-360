appId: com.example.gymappTrainer
name: 04_schedule
env:
  EMAIL: trainer-l3-612493@gym.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "30%,92%"
- extendedWaitUntil:
    visible: "الجدول|التقويم|التوفر|توفر"
    timeout: 15000
- assertVisible: "الجدول|التقويم|التوفر|توفر"
