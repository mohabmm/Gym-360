appId: com.example.gymappTrainer
name: 03_workouts
env:
  EMAIL: trainer@demo.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "50%,92%"
- extendedWaitUntil:
    visible: "القوالب|التمارين|البرامج|تمرين"
    timeout: 15000
- assertVisible: "القوالب|التمارين|البرامج|تمرين"
