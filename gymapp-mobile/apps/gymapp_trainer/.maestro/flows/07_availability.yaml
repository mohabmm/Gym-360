appId: com.example.gymappTrainer
name: 07_availability
env:
  EMAIL: trainer@demo.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "30%,92%"
- tapOn:
    text: "التوفر"
    optional: true
- tapOn:
    text: "الإتاحة"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 15000
- assertNotVisible: "تسجيل الدخول"
