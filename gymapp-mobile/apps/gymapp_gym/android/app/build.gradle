plugins {
    id "com.android.application"
    id "kotlin-android"
    // Reads android/app/google-services.json (Firebase / FCM push).
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing with the Play upload key. Codemagic injects CM_KEYSTORE_*
// (codemagic.yaml `android_signing`); on a dev machine, android/key.properties
// (gitignored). With neither, release builds fall back to the debug key so
// `flutter run --release` keeps working.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (System.getenv("CM_KEYSTORE_PATH")) {
    keystoreProperties["storeFile"] = System.getenv("CM_KEYSTORE_PATH")
    keystoreProperties["storePassword"] = System.getenv("CM_KEYSTORE_PASSWORD")
    keystoreProperties["keyAlias"] = System.getenv("CM_KEY_ALIAS")
    keystoreProperties["keyPassword"] = System.getenv("CM_KEY_PASSWORD")
} else if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystoreProperties["storeFile"] != null

android {
    namespace = "com.gym360.staff"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications (foreground push banners).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.gym360.staff"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
