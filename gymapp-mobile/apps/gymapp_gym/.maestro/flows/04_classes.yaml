appId: com.example.gymappGym
name: 04_classes
env:
  EMAIL: staff@demo.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "30%,92%"
- extendedWaitUntil:
    visible: "الحصص|الجدول|جدول الحصص"
    timeout: 15000
- assertVisible: "الحصص|الجدول|جدول الحصص"
