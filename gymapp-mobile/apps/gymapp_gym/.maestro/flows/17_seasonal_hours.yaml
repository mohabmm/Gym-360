appId: com.example.gymappGym
name: 17_seasonal_hours
env:
  EMAIL: staff@demo.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "10%,92%"
- tapOn:
    text: "ساعات الموسم"
    optional: true
- tapOn:
    text: "المواعيد الموسمية"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 15000
- assertNotVisible: "تسجيل الدخول"
