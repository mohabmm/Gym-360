- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "10%,92%"
- tapOn:
    text: "قوالب الباقات"
    optional: true
- tapOn:
    text: "القوالب"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 15000
- assertNotVisible: "تسجيل الدخول"
