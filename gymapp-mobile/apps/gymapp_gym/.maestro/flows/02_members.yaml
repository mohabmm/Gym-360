appId: com.example.gymappGym
name: 02_members
env:
  EMAIL: staff-l3-612493@gym.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "70%,92%"
- extendedWaitUntil:
    visible: "قائمة الأعضاء|الأعضاء|الاعضاء|بحث"
    timeout: 15000
- assertVisible: "قائمة الأعضاء|الأعضاء|الاعضاء|بحث"
