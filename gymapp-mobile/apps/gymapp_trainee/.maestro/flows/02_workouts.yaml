appId: com.example.gymappTrainee
name: 02_workouts
env:
  EMAIL: trainee@demo.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "70%,92%"
- extendedWaitUntil:
    visible: "مكتبة التمارين|التمارين|تمرين"
    timeout: 15000
- assertVisible: "مكتبة التمارين|التمارين|تمرين"
