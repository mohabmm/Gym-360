appId: com.example.gymappTrainee
name: 05_more
env:
  EMAIL: trainee-l3-612493@gym.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "10%,92%"
- extendedWaitUntil:
    visible: "الإعدادات|الاعدادات|الإعلانات|الاعلانات|الدردشة|المتصدرين|التغذية"
    timeout: 15000
- assertVisible: "الإعدادات|الاعدادات|الإعلانات|الاعلانات|الدردشة|المتصدرين|التغذية"
