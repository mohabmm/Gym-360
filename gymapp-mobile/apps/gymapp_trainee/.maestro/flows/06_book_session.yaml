appId: com.example.gymappTrainee
name: 06_book_session
env:
  EMAIL: trainee-l3-612493@gym.local
  PASSWORD: "123456"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: ".*دخل بريدك.*"
    optional: true
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    text: ".*دخل كلمة المرور.*"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 30000
- tapOn:
    point: "30%,92%"
- tapOn:
    text: "احجز"
    optional: true
- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 15000
- assertNotVisible: "تسجيل الدخول"
